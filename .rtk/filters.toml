schema_version = 1
# RTK Project-Local Filters — auto-generated
# Stack: OS/Shell baseline · Node.js / TypeScript · Docker
# Generated by Nexus Platform

[filters.ssh]
description = "Compact ssh — errors and connection status"
match_command = "^ssh\\b"
strip_ansi = true
keep_lines_matching = [
  "error",
  "Error",
  "Warning",
  "denied",
  "refused",
  "timeout",
  "connected",
  "Authenticated",
]
max_lines = 20

[filters.npm-install]
description = "Compact npm install — summary only"
match_command = "^npm\\s+(install|ci|i)\\b"
strip_ansi = true
keep_lines_matching = [
  "^added",
  "^removed",
  "^changed",
  "^audited",
  "^found",
  "npm warn",
  "npm error",
  "vulnerabilities",
]
max_lines = 15

[filters.eslint]
description = "Compact ESLint — errors and warnings only"
match_command = "^(npx\\s+)?(eslint|next lint)\\b"
strip_ansi = true
keep_lines_matching = [
  "^\\s+\\d+:\\d+\\s+(error|warning)",
  "^/",
  "^src/",
  "\\d+ (error|warning)",
  "problems",
]
max_lines = 80

[filters.jest]
description = "Compact jest — test results and failures"
match_command = "^(npx\\s+)?jest\\b"
strip_ansi = true
keep_lines_matching = [
  "PASS",
  "FAIL",
  "^\\s+✓",
  "^\\s+✕",
  "^Tests:",
  "^Suites:",
  "^Time:",
  "error",
  "Expected",
  "Received",
]
max_lines = 80

[filters.npm-run]
description = "Compact npm run — errors and results"
match_command = "^npm\\s+run\\b"
strip_ansi = true
keep_lines_matching = [
  "^Error",
  "^error",
  "^TypeError",
  "PASS",
  "FAIL",
  "failed",
  "passed",
  "\\d+ test",
  "warning",
]
max_lines = 60

[filters.docker-build]
description = "Compact docker build — steps, errors, and image info"
match_command = "^docker\\s+(build|compose)\\b"
strip_ansi = true
keep_lines_matching = [
  "^#\\d+",
  "^Step ",
  "^STEP ",
  "^ERROR",
  "^error",
  "Successfully built",
  "Successfully tagged",
  "sha256:",
  "exporting to",
  "DONE",
  "CACHED",
  "Creating",
  "Started",
  "Stopping",
]
max_lines = 60
