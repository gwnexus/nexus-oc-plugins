name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Package plugins
        run: |
          mkdir -p dist

          # Individual plugin zips (plugin source + README)
          for dir in 100-compaction-plus 200-cost-control 300-headroom-intercept 400-session-guard; do
            plugin_name=$(basename "$dir")
            zip -j "dist/${plugin_name}.zip" "${dir}"/*.ts "${dir}"/README.md
          done

          # Combined bundle with all plugins
          zip -j dist/nexus-oc-plugins-all.zip \
            100-compaction-plus/nexus-compaction-plus.ts \
            200-cost-control/nexus-cost-control.ts \
            300-headroom-intercept/nexus-headroom-intercept.ts \
            400-session-guard/nexus-session-guard.ts

      - name: Upload artifacts (branch push)
        if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: nexus-oc-plugins-${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 30

      - name: Create GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/100-compaction-plus.zip
            dist/200-cost-control.zip
            dist/300-headroom-intercept.zip
            dist/400-session-guard.zip
            dist/nexus-oc-plugins-all.zip
